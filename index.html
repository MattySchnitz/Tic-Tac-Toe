<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Super Cute Emoji Dog Tic-Tac-Toe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>🐶 Super Cute Emoji Dog Tic-Tac-Toe 🐶</h1>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <span>🐶 Puppy: <strong id="scoreX">0</strong></span>
    <span>🐕 Doggo: <strong id="scoreO">0</strong></span>
  </div>

  <!-- Status -->
  <p id="status">Puppy's turn! 💖</p>

  <!-- Board -->
  <div id="board" class="board"></div>

  <!-- Squeak sound -->
  <audio id="squeak" src="https://actions.google.com/sounds/v1/toys/squeaky_toy.ogg"></audio>

  <script src="script.js"></script>
</body>
</html>
